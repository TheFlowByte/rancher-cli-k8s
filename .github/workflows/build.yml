name: Build and push

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag from Dockerfile
        id: meta
        run: |
          RANCHER=$(grep -oP 'rancher/cli2:\Kv[\d.]+' Dockerfile)
          KUBECTL=$(grep -oP 'k8s-kubectl:\Kv[\d.]+' Dockerfile)
          TAG="${RANCHER}-k8s${KUBECTL}"
          REPO="${GITHUB_REPOSITORY,,}"   # lowercase — обязательно для ghcr
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "Will push: ghcr.io/${REPO}:${TAG} and :latest"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
