name: Build and push

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag from Dockerfile
        id: meta
        run: |
          set -x
          cat Dockerfile

          # Match rancher/cli2:vX.Y.Z (with or without leading 'v')
          RANCHER=$(grep -oP 'rancher/cli2:\K[v0-9.]+' Dockerfile || echo "unknown")
          # Match KUBECTL_VERSION=vX.Y.Z (in ARG, ENV, or RUN)
          KUBECTL=$(grep -oP 'KUBECTL_VERSION[ =]+\K[v0-9.]+' Dockerfile || echo "unknown")

          if [ -z "$RANCHER" ] || [ "$RANCHER" = "unknown" ] || \
             [ -z "$KUBECTL" ] || [ "$KUBECTL" = "unknown" ]; then
            # Fallback to date+sha so we still push something
            TAG="build-$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
            echo "::warning::Could not parse versions (rancher='$RANCHER', kubectl='$KUBECTL'), using fallback tag '$TAG'"
          else
            TAG="${RANCHER}-k8s${KUBECTL}"
          fi

          REPO="${GITHUB_REPOSITORY,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "Will push: ghcr.io/${REPO}:${TAG} and :latest"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
